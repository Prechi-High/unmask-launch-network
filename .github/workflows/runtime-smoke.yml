name: Production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production alias
        run: sleep 45
      - name: Check runtime endpoints
        run: |
          set -x
          for path in api/ping api/env-check api/mail-check api/crypto-check api/supabase-check api/server-check api/health; do
            echo "===== $path ====="
            curl -sS -i --max-time 20 "https://unmask-launch-network.vercel.app/$path" || true
            echo
          done
