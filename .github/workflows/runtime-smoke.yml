name: Production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production alias
        run: sleep 45
      - name: Check production runtime
        run: |
          set -x
          curl -sS -i --max-time 20 https://unmask-launch-network.vercel.app/api/ping
          curl -sS -i --max-time 20 https://unmask-launch-network.vercel.app/api/env-check
          curl -sS -i --max-time 20 https://unmask-launch-network.vercel.app/api/health
          curl -sS -i --max-time 20 -X POST https://unmask-launch-network.vercel.app/api/auth/signup \
            -H 'content-type: application/json' \
            --data '{}'
